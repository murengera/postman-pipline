name: Postman API Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.BASE_URL }}" ]; then
            echo "ERROR: BASE_URL secret is not set. Go to GitHub repo Settings → Secrets and variables → Actions and add BASE_URL."
            exit 1
          fi

      - name: Run Postman Collection
        run: |
          newman run ecommerce-API-project.json \
            --environment my-environment.json \
            --env-var "base_url=${{ secrets.BASE_URL }}" \
            --env-var "access_token=" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-report.html

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-test-report
          path: newman-report.html
